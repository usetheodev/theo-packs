# L2 — PR integration: builds a representative subset per provider
# (3-5 examples) with BuildKit + structure-test. Target: < 10 min.
#
# Triggered on PR + push to main. Full matrix lives in e2e-l3.yml
# (nightly + main-only).
#
# T5.1, T5.2 — robust-test-suite-plan.

name: E2E L2 (PR integration)

on:
  pull_request:
    paths:
      - "core/**"
      - "cmd/**"
      - "examples/**"
      - "e2e/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/e2e-l2.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e-l2:
    name: E2E L2 (BuildKit, representative)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ["0/3", "1/3", "2/3"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4

      - name: Install hadolint
        run: |
          curl -fsSL https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64 -o /usr/local/bin/hadolint
          chmod +x /usr/local/bin/hadolint

      - name: Install dive
        run: |
          DIVE_VERSION=0.12.0
          curl -fsSL https://github.com/wagoodman/dive/releases/download/v${DIVE_VERSION}/dive_${DIVE_VERSION}_linux_amd64.tar.gz | tar -xz -C /tmp dive
          mv /tmp/dive /usr/local/bin/dive

      - name: Install container-structure-test
        run: |
          CST_VERSION=1.19.3
          curl -fsSL https://storage.googleapis.com/container-structure-test/v${CST_VERSION}/container-structure-test-linux-amd64 -o /usr/local/bin/container-structure-test
          chmod +x /usr/local/bin/container-structure-test

      - name: E2E sharded (BuildKit)
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: go test -tags e2e -timeout 900s -run TestE2E_All ./e2e/
